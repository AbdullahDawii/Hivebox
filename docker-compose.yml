services:
  app:
    build: .
    ports:
      - "5050:5000"
    environment:
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: minio_strong_password
      MINIO_BUCKET: hivebox-data
    depends_on:
      - redis
      - minio

  redis:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_strong_password
    volumes:
      - minio-data:/data

volumes:
  minio-data:
